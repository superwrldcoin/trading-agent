<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Agent</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Trading Agent</h1>
      <p class="sub">Analysis only. <b>Quick check</b>: no AI, cached fetch. <b>Full agent</b>: Claude Code with all skills and memory.</p>
    </div>
    <div class="top-actions">
      <button class="ghost" id="historyBtn" title="Past runs">History</button>
      <button class="ghost" id="settingsBtn" title="Settings">Settings</button>
    </div>
  </header>

  <section class="panel" id="inputPanel">
    <textarea id="q" placeholder="BTC long, 20x, entry 98,400, how does it look?"></textarea>
    <div class="row" id="chips"></div>
    <div class="row">
      <label>Equity <input id="equity" placeholder="optional" inputmode="decimal"></label>
      <label>Risk % <input id="risk" placeholder="1" inputmode="decimal"></label>
      <button id="quick">Quick check</button>
      <button id="agent" class="secondary">Full agent analysis</button>
      <button id="portfolio" class="secondary" title="Exposure and stress test for memory/positions.json">Portfolio</button>
      <button id="cancel" class="danger" hidden>Cancel</button>
      <span class="status" id="status" aria-live="polite"></span>
    </div>
  </section>

  <section class="panel" id="progress" hidden>
    <ol class="steps" id="steps"></ol>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <section id="skeleton" class="panel" hidden>
    <div class="sk w40"></div><div class="sk w90"></div><div class="sk w75"></div><div class="sk w60"></div>
  </section>

  <section id="results" hidden>
    <div class="panel ladder-wrap" id="ladderWrap" hidden><h2>Price ladder</h2><div id="ladder"></div></div>
    <div class="panel" id="out"></div>
  </section>
</main>

<aside class="drawer" id="settings" aria-hidden="true">
  <h2>Settings</h2>
  <label>Default equity <input id="s_equity" inputmode="decimal"></label>
  <label>Default risk % <input id="s_risk" inputmode="decimal"></label>
  <label>Theme
    <select id="s_theme"><option value="auto">Auto</option><option value="dark">Dark</option><option value="light">Light</option></select>
  </label>
  <label>Default action
    <select id="s_action"><option value="quick">Quick check</option><option value="agent">Full agent</option></select>
  </label>
  <label>Symbol shortcuts <select id="s_symbols" multiple size="6"></select></label>
  <label class="check"><input type="checkbox" id="s_anim"> Animations</label>
  <label class="check"><input type="checkbox" id="s_ladder"> Price ladder</label>
  <h3>Your rules (read-only)</h3>
  <pre id="rulesBox">loading...</pre>
  <div class="row"><button id="saveSettings">Save</button><button class="ghost" data-close>Close</button></div>
</aside>

<aside class="drawer" id="history" aria-hidden="true">
  <h2>History</h2>
  <ul id="histList"></ul>
  <div class="row"><button class="ghost" data-close>Close</button></div>
</aside>
<script src="/static/app.js"></script>
</body>
</html>
