# ---------------------------------------------------------------------------
# DRIVERS (5): explain why your positions move
# ---------------------------------------------------------------------------
drivers:
  - symbol: "DX-Y.NYB"
    name: US Dollar Index
    source: yfinance
    refresh_minutes: 15
    influences: ["SI=F", "SLV", "GLD", "BTC-USD", "BCH-USD"]
    expected_relation: "Strong dollar tends to pressure metals and crypto (verify with rolling correlation)"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 330 daily bars, last 2026-10-04 = 101.88; 1h OK (90 bars)"

  - symbol: "^TNX"
    name: US 10-year Treasury yield
    source: yfinance
    refresh_minutes: 15
    influences: ["GLD", "SI=F", "MSFT"]
    expected_relation: "Rising yields tend to hurt non-yielding assets and growth stocks"
    notes: "Yahoo quotes this as yield x10 on some feeds; confirm units before use."
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 5.28; 1h OK (35 bars); units: percent"

  - symbol: "^VIX"
    name: CBOE Volatility Index
    source: yfinance
    refresh_minutes: 15
    influences: ["BTC-USD", "BCH-USD", "MSFT"]
    expected_relation: "Risk-off regime detection; spikes often coincide with leveraged-asset drawdowns"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 387 daily bars, last 2026-10-02 = 15.31; 1h OK (70 bars)"

  - symbol: "QQQ"
    name: Invesco Nasdaq-100 ETF
    source: yfinance
    refresh_minutes: 5
    influences: ["MSFT", "BTC-USD"]
    expected_relation: "Tech risk appetite; BTC often correlates with it, strength varies over time"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 749.58; 1h OK (35 bars)"

  - symbol: "DFII10"
    name: 10-year real yield (TIPS)
    source: fred
    fred_series: DFII10
    refresh_minutes: 1440            # daily series
    influences: ["GLD", "SI=F", "SLV"]
    expected_relation: "Falling real yields tend to support gold and silver"
    notes: "Try the keyless FRED CSV endpoint first. If it fails, read FRED_API_KEY from env. If neither works, report unavailable."
    verified: true
    last_verified: 2026-10-04
    verify_note: "FRED 5942 obs, last 2026-10-01 = 2.88"

