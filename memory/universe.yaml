# ---------------------------------------------------------------------------
# COMPUTED RATIOS (calculated in code by tools/ratios.py, never by the model)
# trend_ref: compare the ratio to its own moving average to label direction
# ---------------------------------------------------------------------------
ratios:
  - name: gold_silver_ratio
    formula: "GC=F / SI=F"
    relevant_to: ["SI=F", "SLV", "GLD"]
    trend_ref: sma_50d
    reading: "Rising = silver underperforming gold; falling = silver outperforming"

  - name: bch_btc
    formula: "BCH-USD / BTC-USD"
    relevant_to: ["BCH-USD"]
    trend_ref: sma_50d
    reading: "Relative strength of BCH versus BTC"

  - name: eth_btc
    formula: "ETH-USD / BTC-USD"
    relevant_to: ["BTC-USD", "BCH-USD"]
    trend_ref: sma_50d
    reading: "Crypto risk appetite; rising often signals broader altcoin strength"

  # --- filled in by the agent on 2026-10-04 (the pasted file was cut off here) ---
  - name: msft_qqq
    formula: "MSFT / QQQ"
    relevant_to: ["MSFT"]
    trend_ref: sma_50d
    reading: "Rising = MSFT outperforming the Nasdaq-100; falling = lagging it"

  - name: gdx_gld
    formula: "GDX / GLD"
    relevant_to: ["GLD", "XAU/USD"]
    trend_ref: sma_50d
    reading: "Rising = miners leading the metal (often bullish confirmation); falling = miners lagging (caution at highs)"

  # --- added 2026-11-05 with the Tier 1 instruments ---
  - name: sol_btc
    formula: "SOL-USD / BTC-USD"
    relevant_to: ["SOL-USD"]
    trend_ref: sma_50d
    reading: "Rising = SOL outperforming BTC (alt risk appetite); falling = rotation back to BTC"

  - name: nq_es
    formula: "NQ=F / ES=F"
    relevant_to: ["NQ=F", "ES=F", "MSFT"]
    trend_ref: sma_50d
    reading: "Rising = tech/growth leading the broad market; falling = defensive rotation or tech-led selling"

