  - symbol: "HG=F"
    name: Copper futures
    source: yfinance
    refresh_minutes: 15
    pairs_with: ["SI=F"]
    purpose: "Industrial demand context for silver"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 331 daily bars, last 2026-10-04 = 6.59; 1h OK (87 bars); continuous contract: 13 daily moves > 4% in the window (check for roll gaps before using levels across them)"

  - symbol: "NVDA"
    name: NVIDIA
    source: yfinance
    refresh_minutes: 15
    pairs_with: ["MSFT"]
    purpose: "AI-capex sentiment peer; its earnings often move MSFT"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 233.95; 1h OK (35 bars)"

  - symbol: "XLK"
    name: Technology Select Sector SPDR
    source: yfinance
    refresh_minutes: 15
    pairs_with: ["MSFT"]
    purpose: "Is MSFT leading or lagging the tech sector?"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 199.81; 1h OK (35 bars)"

# ---------------------------------------------------------------------------
# COMPUTED RATIOS (calculated in code by tools/ratios.py, never by the model)
# trend_ref: compare the ratio to its own moving average to label direction
# ---------------------------------------------------------------------------
ratios:
  - name: gold_silver_ratio
    formula: "GC=F / SI=F"
    relevant_to: ["SI=F", "SLV", "GLD"]
    trend_ref: sma_50d
    reading: "Rising = silver underperforming gold; falling = silver outperforming"

  - name: bch_btc
    formula: "BCH-USD / BTC-USD"
    relevant_to: ["BCH-USD"]
    trend_ref: sma_50d
    reading: "Relative strength of BCH versus BTC"

  - name: eth_btc
    formula: "ETH-USD / BTC-USD"
    relevant_to: ["BTC-USD", "BCH-USD"]
    trend_ref: sma_50d
    reading: "Crypto risk appetite; rising often signals broader altcoin strength"

  # --- filled in by the agent on 2026-10-04 (the pasted file was cut off here) ---
  - name: msft_qqq
    formula: "MSFT / QQQ"
    relevant_to: ["MSFT"]
    trend_ref: sma_50d
    reading: "Rising = MSFT outperforming the Nasdaq-100; falling = lagging it"

  - name: gdx_gld
    formula: "GDX / GLD"
    relevant_to: ["GLD", "XAU/USD"]
    trend_ref: sma_50d
    reading: "Rising = miners leading the metal (often bullish confirmation); falling = miners lagging (caution at highs)"

# ---------------------------------------------------------------------------
# CONTEXT MAP (filled in by the agent from the entries above; the pasted file was cut off here)
# What to pull alongside each core instrument. feeds = extra_feeds from tools/crypto_feeds.py
# ---------------------------------------------------------------------------
context:
  BTC/USDT: {pairs: ["ETH-USD", "IBIT"], drivers: ["DX-Y.NYB", "^VIX", "QQQ"], ratios: ["eth_btc"], feeds: [funding_rate, open_interest, long_short_ratio, btc_dominance]}
  BCH/USDT: {pairs: ["BTC-USD"], drivers: ["DX-Y.NYB", "^VIX"], ratios: ["bch_btc", "eth_btc"], feeds: [funding_rate, open_interest, btc_dominance]}
  XAU/USD:  {pairs: ["GLD", "GC=F", "SI=F"], drivers: ["DX-Y.NYB", "DFII10", "^TNX"], ratios: ["gold_silver_ratio", "gdx_gld"], feeds: []}
  SI:       {pairs: ["GC=F", "SIL", "HG=F"], drivers: ["DX-Y.NYB", "DFII10", "^TNX"], ratios: ["gold_silver_ratio"], feeds: []}
  SLV:      {pairs: ["SI=F", "SIL"], drivers: ["DX-Y.NYB", "DFII10"], ratios: ["gold_silver_ratio"], feeds: []}
  GLD:      {pairs: ["GC=F", "GDX"], drivers: ["DX-Y.NYB", "DFII10", "^TNX"], ratios: ["gold_silver_ratio", "gdx_gld"], feeds: []}
  MSFT:     {pairs: ["QQQ", "XLK", "NVDA"], drivers: ["^TNX", "^VIX", "QQQ"], ratios: ["msft_qqq"], feeds: []}
