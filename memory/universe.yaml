    backup: {source: yfinance, symbol: "BCH-USD"}
    refresh_minutes: 5
    pairs_with: ["BTC-USD"]          # use the BCH/BTC ratio for relative strength
    drivers: ["DX-Y.NYB", "^VIX"]
    extra_feeds: [funding_rate, open_interest, btc_dominance, perp_basis]
    notes: "Usually a beta play on BTC. Ratio BCH/BTC shows whether the move is BCH-specific."
    verified: true
    last_verified: 2026-11-05
    verify_note: "OKX BCH-USDT last 282.23 at 11-05 05:00Z; perp BCH-USDT-SWAP last 282.01, 1 contract = 0.1 BCH; backup BCH-USD OK (281.87)"

  - symbol: "XAU/USD"
