# memory/universe.yaml
# Single source of truth for every ticker and data feed the agent may use.
# Edit this file to add or drop symbols; tools read it, nothing is hardcoded.
#
# STATUS: every entry ships with verified: false. Run the fetch tool against each
# symbol, then set verified: true (and last_verified: YYYY-MM-DD) or add a note
# describing the failure. Do not trust an unverified symbol for a live analysis.
#   -> python tools/universe.py verify   (fetches every symbol and writes the result back here)
#
# Roles:
#   core    = instruments you trade and analyze directly
#   driver  = macro/regime variables that influence your core assets
#   pair    = same-theme instruments that confirm or contradict a core move
#
# Sources: yfinance | fred | exchange_public | coingecko | manual
# Note: the starter set is 18 slots. Silver has two instruments (SI=F futures and
# SLV ETF), so the file has 19 entries. Spot gold (XAU/USD) was added back to core
# on 2026-10-04 at the user's request, so there are 20.
#
# Agent fields added to core entries (2026-10-04):
#   id       = name the tools and reports use (e.g. "BTC/USDT")
#   session  = crypto | gold_spot | cme | equity  (day/week boundaries and 4H bin anchors)
#   feed     = primary price feed for levels and candles; backup = used if the primary fails
#   Crypto stays on OKX (USDT pairs, native 4H, matched the user's charts); yfinance is the backup.

meta:
  version: 1
  timeframes: ["15m", "1h", "4h", "1D", "1W"]
  resample_4h_from_1h: true        # yfinance has no native 4h; build it from 1h
  timestamp_all_pulls: true        # every datapoint carries UTC time + source
  correlation_windows_days: [30, 90]
  correlations_are_not_permanent: true   # always report rolling values, never assume
  yfinance_unofficial: true        # can break or lag; keep user-supplied-numbers fallback live
  futures_roll_caveat: true        # =F symbols are continuous contracts; flag roll gaps

# ---------------------------------------------------------------------------
# CORE (6 instruments, 7 entries counting both silver instruments)
# ---------------------------------------------------------------------------
core:
  - symbol: "BTC-USD"
    id: "BTC/USDT"
    name: Bitcoin
    asset_class: crypto
    session: crypto
    source: exchange_public
    feed: {venue: okx, instrument: "BTC-USDT"}
    backup: {source: yfinance, symbol: "BTC-USD"}
    refresh_minutes: 5
    pairs_with: ["ETH-USD", "IBIT"]
    drivers: ["DX-Y.NYB", "^VIX", "QQQ"]
    extra_feeds: [funding_rate, open_interest, long_short_ratio, btc_dominance]
    notes: "Often trades as high-beta tech. Check QQQ and DXY before trusting a BTC-only read."
    verified: true
    last_verified: 2026-10-04
    verify_note: "OKX BTC-USDT last 86,433.10 at 10-04 22:00Z; backup BTC-USD OK (86,415.59)"

  - symbol: "BCH-USD"
    id: "BCH/USDT"
    name: Bitcoin Cash
    asset_class: crypto
    session: crypto
    source: exchange_public
    feed: {venue: okx, instrument: "BCH-USDT"}
    backup: {source: yfinance, symbol: "BCH-USD"}
    refresh_minutes: 5
    pairs_with: ["BTC-USD"]          # use the BCH/BTC ratio for relative strength
    drivers: ["DX-Y.NYB", "^VIX"]
    extra_feeds: [funding_rate, open_interest, btc_dominance]
    notes: "Usually a beta play on BTC. Ratio BCH/BTC shows whether the move is BCH-specific."
    verified: true
    last_verified: 2026-10-04
    verify_note: "OKX BCH-USDT last 318.40 at 10-04 22:00Z; backup BCH-USD OK (318.31)"

  - symbol: "XAU/USD"
    id: "XAU/USD"
    name: Spot gold (via OKX Tether Gold proxy)
    asset_class: metals
    session: gold_spot
    source: exchange_public
    feed: {venue: okx, instrument: "XAUT-USDT", drop_weekend: true}
    spot_check: {venue: swissquote, base: "XAU", quote: "USD"}
    backup: {source: yfinance, symbol: "GC=F"}   # futures: trades above spot (about $22 on 2026-10-04)
    refresh_minutes: 5
    pairs_with: ["GLD", "GC=F", "SI=F"]
    drivers: ["DX-Y.NYB", "DFII10", "^TNX"]
    notes: "Spot proxy: XAUT can trade at a small premium/discount; Swissquote spot cross-check warns above 0.2%. XAUT volume is token volume."
    verified: true
    last_verified: 2026-10-04
    verify_note: "OKX XAUT-USDT last 4,145.00 at 10-04 22:00Z; vs Swissquote spot 4,142.99 (+0.05%); backup GC=F OK (4,168.70)"

  - symbol: "SI=F"
    id: "SI"
    name: Silver futures (spot-like reference)
    asset_class: metals
    session: cme
    source: yfinance
    refresh_minutes: 5
    pairs_with: ["GC=F", "SIL", "HG=F"]
    drivers: ["DX-Y.NYB", "DFII10", "^TNX"]
    notes: "Industrial plus monetary demand. Gap risk over weekends and session breaks."
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 331 daily bars, last 2026-10-04 = 61.04; 1h OK (87 bars); continuous contract: 69 daily moves > 4% in the window (check for roll gaps before using levels across them)"

  - symbol: "SLV"
    id: "SLV"
    name: iShares Silver Trust (ETF)
    asset_class: metals
    session: equity
    source: yfinance
    refresh_minutes: 5
    pairs_with: ["SI=F", "SIL"]
    drivers: ["DX-Y.NYB", "DFII10"]
    notes: "Use for flow and volume context; use SI=F for price levels."
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 54.74; 1h OK (35 bars)"

  - symbol: "GLD"
    id: "GLD"
    name: SPDR Gold Shares (ETF)
    asset_class: metals
    session: equity
    source: yfinance
    refresh_minutes: 5
    pairs_with: ["GC=F", "GDX"]
    drivers: ["DX-Y.NYB", "DFII10", "^TNX"]
    notes: "Real yields are often the cleaner driver than nominal yields."
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 380.14; 1h OK (35 bars)"

  - symbol: "MSFT"
    id: "MSFT"
    name: Microsoft
    asset_class: equity
    session: equity
    source: yfinance
    refresh_minutes: 5
    pairs_with: ["QQQ", "XLK", "NVDA"]
    drivers: ["^TNX", "^VIX", "QQQ"]
    notes: "Check earnings date and peer earnings (NVDA, AMZN, GOOGL) before any position review."
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 517.53; 1h OK (35 bars)"

# ---------------------------------------------------------------------------
# DRIVERS (5): explain why your positions move
# ---------------------------------------------------------------------------
drivers:
  - symbol: "DX-Y.NYB"
    name: US Dollar Index
    source: yfinance
    refresh_minutes: 15
    influences: ["SI=F", "SLV", "GLD", "BTC-USD", "BCH-USD"]
    expected_relation: "Strong dollar tends to pressure metals and crypto (verify with rolling correlation)"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 330 daily bars, last 2026-10-04 = 101.88; 1h OK (90 bars)"

  - symbol: "^TNX"
    name: US 10-year Treasury yield
    source: yfinance
    refresh_minutes: 15
    influences: ["GLD", "SI=F", "MSFT"]
    expected_relation: "Rising yields tend to hurt non-yielding assets and growth stocks"
    notes: "Yahoo quotes this as yield x10 on some feeds; confirm units before use."
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 5.28; 1h OK (35 bars); units: percent"

  - symbol: "^VIX"
    name: CBOE Volatility Index
    source: yfinance
    refresh_minutes: 15
    influences: ["BTC-USD", "BCH-USD", "MSFT"]
    expected_relation: "Risk-off regime detection; spikes often coincide with leveraged-asset drawdowns"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 387 daily bars, last 2026-10-02 = 15.31; 1h OK (70 bars)"

  - symbol: "QQQ"
    name: Invesco Nasdaq-100 ETF
    source: yfinance
    refresh_minutes: 5
    influences: ["MSFT", "BTC-USD"]
    expected_relation: "Tech risk appetite; BTC often correlates with it, strength varies over time"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 749.58; 1h OK (35 bars)"

  - symbol: "DFII10"
    name: 10-year real yield (TIPS)
    source: fred
    fred_series: DFII10
    refresh_minutes: 1440            # daily series
    influences: ["GLD", "SI=F", "SLV"]
    expected_relation: "Falling real yields tend to support gold and silver"
    notes: "Try the keyless FRED CSV endpoint first. If it fails, read FRED_API_KEY from env. If neither works, report unavailable."
    verified: true
    last_verified: 2026-10-04
    verify_note: "FRED 5942 obs, last 2026-10-01 = 2.88"

# ---------------------------------------------------------------------------
# PAIRS (8): confirm or contradict a core move
# ---------------------------------------------------------------------------
pairs:
  - symbol: "ETH-USD"
    name: Ethereum
    source: yfinance
    refresh_minutes: 5
    pairs_with: ["BTC-USD"]
    purpose: "Shows whether a move is crypto-wide or BTC-only; feeds the ETH/BTC ratio"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-04 = 2,725.26; 1h OK (119 bars)"

  - symbol: "IBIT"
    name: iShares Bitcoin Trust (spot BTC ETF)
    source: yfinance
    refresh_minutes: 5
    pairs_with: ["BTC-USD"]
    purpose: "US-hours price action and institutional flow proxy"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 47.73; 1h OK (35 bars)"

  - symbol: "GC=F"
    name: Gold futures
    source: yfinance
    refresh_minutes: 5
    pairs_with: ["GLD", "SI=F"]
    purpose: "Futures reference for gold; numerator of the gold/silver ratio"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 331 daily bars, last 2026-10-04 = 4,168.80; 1h OK (87 bars); continuous contract: 6 daily moves > 4% in the window (check for roll gaps before using levels across them)"

  - symbol: "GDX"
    name: VanEck Gold Miners ETF
    source: yfinance
    refresh_minutes: 15
    pairs_with: ["GLD"]
    purpose: "Miners often lead or diverge from the metal at turns"
    verified: true
    last_verified: 2026-10-04
    verify_note: "yfinance 400 daily bars, last 2026-10-02 = 87.78; 1h OK (35 bars)"

  - symbol: "SIL"
    name: Global X Silver Miners ETF
    source: yfinance
    refresh_minutes: 15
