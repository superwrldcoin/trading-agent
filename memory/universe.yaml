# memory/universe.yaml
# Single source of truth for every ticker and data feed the agent may use.
# Edit this file to add or drop symbols; tools read it, nothing is hardcoded.
#
# STATUS: every entry ships with verified: false. Run the fetch tool against each
# symbol, then set verified: true (and last_verified: YYYY-MM-DD) or add a note
# describing the failure. Do not trust an unverified symbol for a live analysis.
#   -> python tools/universe.py verify   (fetches every symbol and writes the result back here)
#
# Roles:
#   core    = instruments you trade and analyze directly
#   driver  = macro/regime variables that influence your core assets
#   pair    = same-theme instruments that confirm or contradict a core move
#
# Sources: yfinance | fred | exchange_public | coingecko | manual
# Note: the starter set is 18 slots. Silver has two instruments (SI=F futures and
# SLV ETF), so the file has 19 entries. Spot gold (XAU/USD) was added back to core
# on 2026-10-04 at the user's request, so there are 20.
#
# Agent fields added to core entries (2026-10-04):
#   id       = name the tools and reports use (e.g. "BTC/USDT")
#   session  = crypto | gold_spot | cme | equity  (day/week boundaries and 4H bin anchors)
#   feed     = primary price feed for levels and candles; backup = used if the primary fails
#   Crypto stays on OKX (USDT pairs, native 4H, matched the user's charts); yfinance is the backup.

meta:
  version: 1
  timeframes: ["15m", "1h", "4h", "1D", "1W"]
  resample_4h_from_1h: true        # yfinance has no native 4h; build it from 1h
  timestamp_all_pulls: true        # every datapoint carries UTC time + source
  correlation_windows_days: [30, 90]
  correlations_are_not_permanent: true   # always report rolling values, never assume
  yfinance_unofficial: true        # can break or lag; keep user-supplied-numbers fallback live
  futures_roll_caveat: true        # =F symbols are continuous contracts; flag roll gaps

# ---------------------------------------------------------------------------
# CORE (12 entries: the original 7 + ETH/USDT, SOL/USDT, MNQ, MES, MGC added 2026-11-05)
# contract: futures contract spec (micros); position_calc reports whole contracts from it.
# perp:     the OKX perpetual the user actually trades; levels still come from `feed` (spot),
#           crypto_feeds.py perp_basis reports the perp-vs-spot gap and the mark price.
# ---------------------------------------------------------------------------
core:
  - symbol: "BTC-USD"
    id: "BTC/USDT"
    name: Bitcoin
    asset_class: crypto
    session: crypto
    source: exchange_public
    feed: {venue: okx, instrument: "BTC-USDT"}
    perp: {venue: okx, instrument: "BTC-USDT-SWAP"}   # the user trades OKX perps (stated 2026-11-05)
    backup: {source: yfinance, symbol: "BTC-USD"}
    refresh_minutes: 5
    pairs_with: ["ETH-USD", "IBIT"]
    drivers: ["DX-Y.NYB", "^VIX", "QQQ"]
    extra_feeds: [funding_rate, open_interest, long_short_ratio, btc_dominance, perp_basis]
    notes: "Often trades as high-beta tech. Check QQQ and DXY before trusting a BTC-only read."
    verified: true
    last_verified: 2026-11-05
    verify_note: "OKX BTC-USDT last 80,503.80 at 11-05 05:00Z; perp BTC-USDT-SWAP last 80,467.30, 1 contract = 0.01 BTC; backup BTC-USD OK (80,412.95)"

  - symbol: "BCH-USD"
    id: "BCH/USDT"
    name: Bitcoin Cash
    asset_class: crypto
    session: crypto
    source: exchange_public
    feed: {venue: okx, instrument: "BCH-USDT"}
